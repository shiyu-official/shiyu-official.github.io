name: 名所制覇の手動補正
description: 近くを通っただけで訪問扱いになった名所を、名前を選んで未訪問へ戻します
title: "[spots] 名所制覇の手動補正"
labels: ["spot-override"]
body:
  - type: markdown
    attributes:
      value: |
        通常は管理ページ **spots-admin.html** の「Issueで反映」ボタンが便利です（名前をタップで切替）。
        ここから手動で行う場合は、下のプルダウンで名所を選んでください。**選んだ名所＝その状態に設定**します（送信で自動反映）。
  - type: dropdown
    id: unvisit
    attributes:
      label: 訪問扱いを外す（未訪問にする）
      description: "自動判定で訪問扱いだが、実際は通過しただけの名所を選ぶ（複数可）"
      multiple: true
      options:
