name: Dormy visit (issue)

# Issueフォーム「ドーミーイン宿泊を追加」(label: dormy-visit) が立つと、
# 本文を解析して data/dormy_visits.json に追記、写真をサムネイル化して保存し、
# 完了コメントを付けてIssueをクローズする。
on:
  issues:
    types: [opened, edited, reopened, labeled]

permissions:
  contents: write
  issues: write

concurrency:
  group: dormy-visit
  cancel-in-progress: false

jobs:
  add:
    # ラベル `dormy-visit` が付いていれば動く。
    # ラベル未作成でも、フォームが付けるタイトル "[dormy] ..." で起動できるよう保険を併用。
    if: >-
      contains(join(github.event.issue.labels.*.name, ','), 'dormy-visit') ||
      startsWith(github.event.issue.title, '[dormy]')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Pillow
        run: pip install --quiet Pillow

      - name: Parse issue and update visits
        id: run
        env:
          ISSUE_BODY: ${{ github.event.issue.body }}
        run: |
          python scripts/build_dormy_visit.py | tee /tmp/out.txt
          echo "status=$(grep -oP '(?<=^STATUS=).*' /tmp/out.txt | head -1)" >> "$GITHUB_OUTPUT"
          echo "message=$(grep -oP '(?<=^MESSAGE=).*' /tmp/out.txt | head -1)" >> "$GITHUB_OUTPUT"

      - name: Commit changes
        if: steps.run.outputs.status == 'ok'
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/dormy_visits.json images/dormy || true
          if [ -n "$(git status --porcelain)" ]; then
            git commit -m "chore: add dormy visit [skip build]"
            git push
          fi

      - name: Comment result
        uses: actions/github-script@v7
        with:
          script: |
            const status = "${{ steps.run.outputs.status }}";
            const message = `${{ steps.run.outputs.message }}`;
            await github.rest.issues.createComment({
              owner: context.repo.owner, repo: context.repo.repo,
              issue_number: context.issue.number,
              body: (status === 'ok' ? '✅ ' : '⚠️ ') + message
            });
            if (status === 'ok') {
              await github.rest.issues.update({
                owner: context.repo.owner, repo: context.repo.repo,
                issue_number: context.issue.number, state: 'closed'
              });
            }
