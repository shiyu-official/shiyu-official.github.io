<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>名所制覇 手動補正 ｜ 管理</title>
<link rel="stylesheet" href="css/theme.css">
<style>
  /* ---- このページ専用の最小スタイル（theme.css のトークンを利用）---- */
  * { box-sizing: border-box; }
  body {
    margin: 0; padding: 0 0 132px;
    font-family: var(--base-font); font-size: var(--base-font-size);
    color: var(--bg-inverse-color); background: var(--light-color);
    line-height: 1.7;
  }
  .wrap { width: min(94%, 760px); margin-inline: auto; }
  header.admin {
    background: var(--bg-color); border-bottom: 1px solid var(--bg-border-color);
    padding: 1rem 0 .8rem; position: sticky; top: 0; z-index: 5;
  }
  h1 { font-size: 1.15rem; margin: 0 0 .1rem; letter-spacing: .04em; }
  .sub { color: var(--muted-color); font-size: .8rem; margin: 0; }
  .stat { display: flex; align-items: baseline; gap: .5rem; margin-top: .5rem; flex-wrap: wrap; }
  .stat .big { font-family: var(--accent-font); font-size: 1.7rem; color: var(--primary-dark-color); line-height: 1; }
  .stat .chg { font-size: .78rem; color: var(--accent-color); }
  .search { margin-top: .6rem; }
  .search input {
    width: 100%; padding: .55rem .7rem; border: 1px solid var(--bg-border-color);
    border-radius: var(--radius-s); font: inherit; background: var(--bg-color);
  }

  .cat { background: var(--bg-color); border: 1px solid var(--bg-border-color);
         border-radius: var(--radius); padding: .7rem .85rem; margin: .9rem 0; }
  .cat__head { display: flex; align-items: center; gap: .5rem; margin-bottom: .35rem; }
  .cat__head img { width: 30px; height: 30px; object-fit: contain; flex: none; }
  .cat__name { font-weight: 600; letter-spacing: .03em; }
  .cat__count { margin-left: auto; font-family: var(--accent-font); font-size: 1.05rem; color: var(--primary-dark-color); }
  .cat__count.done { color: var(--accent-color); }

  .row { display: flex; align-items: center; gap: .6rem; padding: .4rem .15rem; border-top: 1px dashed #e4e8ee; }
  .row:first-of-type { border-top: 0; }
  .row__body { flex: 1 1 auto; min-width: 0; }
  .row__name { font-weight: 500; }
  .row__pref { color: var(--muted-color); font-size: .8rem; margin-left: .35em; }
  .badge { font-size: .68rem; padding: .05em .5em; border-radius: 999px; margin-left: .4em; vertical-align: middle; }
  .badge.manual { background: #fdece7; color: var(--accent-color); border: 1px solid #f4c7bb; }
  .badge.auto   { background: var(--light-color); color: var(--muted-color); border: 1px solid var(--bg-border-color); }

  /* トグル（訪問済み / 未訪問）*/
  .toggle {
    flex: none; border: 1px solid var(--bg-border-color); background: var(--bg-color);
    border-radius: 999px; padding: .32rem .8rem; font: inherit; font-size: .82rem;
    cursor: pointer; min-width: 92px; text-align: center; transition: .15s;
    -webkit-tap-highlight-color: transparent;
  }
  .toggle[aria-pressed="true"]  { background: var(--primary-color); border-color: var(--primary-color); color: #fff; }
  .toggle[aria-pressed="false"] { background: #fff; color: var(--muted-color); }
  .toggle::before { content: "○ 未訪問"; }
  .toggle[aria-pressed="true"]::before { content: "✓ 訪問済み"; }

  /* 下部アクションバー */
  .bar {
    position: fixed; left: 0; right: 0; bottom: 0; background: var(--bg-color);
    border-top: 1px solid var(--bg-border-color); box-shadow: var(--shadow-2);
    padding: .6rem 0; z-index: 6;
  }
  .bar .wrap { display: flex; gap: .5rem; align-items: center; flex-wrap: wrap; }
  .btn {
    appearance: none; border: 1px solid var(--primary-color); background: var(--primary-color);
    color: #fff; border-radius: var(--radius-s); padding: .55rem .9rem; font: inherit; font-size: .85rem;
    cursor: pointer; text-decoration: none; display: inline-flex; align-items: center; gap: .35em; white-space: nowrap;
  }
  .btn.sec { background: #fff; color: var(--primary-dark-color); }
  .btn.ghost { background: #fff; color: var(--muted-color); border-color: var(--bg-border-color); }
  .btn[hidden] { display: none; }
  .bar .note { flex: 1 1 100%; color: var(--muted-color); font-size: .74rem; margin: 0; order: -1; }
  details.raw { flex: 1 1 100%; }
  details.raw summary { color: var(--muted-color); font-size: .78rem; cursor: pointer; }
  details.raw textarea { width: 100%; min-height: 92px; margin-top: .4rem; font-family: ui-monospace, monospace;
    font-size: .78rem; border: 1px solid var(--bg-border-color); border-radius: var(--radius-s); padding: .5rem; }
  .loading, .error { padding: 2rem 0; color: var(--muted-color); }
  .error { color: var(--accent-color); }
  .hidden { display: none !important; }
  .toast { position: fixed; left: 50%; bottom: 150px; transform: translateX(-50%);
    background: #222; color: #fff; padding: .5rem .9rem; border-radius: 999px; font-size: .8rem; opacity: 0;
    transition: opacity .2s; pointer-events: none; z-index: 9; }
  .toast.show { opacity: .95; }
</style>
</head>
<body>
<header class="admin">
  <div class="wrap">
    <h1>名所制覇 ・ 手動補正</h1>
    <p class="sub">近くを通っただけで訪問扱いになった名所を、名前を見てタップで切り替え。IDやコードは触りません。</p>
    <div class="stat">
      <span class="big" id="stat-count">–</span>
      <span id="stat-frac" class="sub">/ – 制覇</span>
      <span class="chg" id="stat-chg"></span>
    </div>
    <div class="search"><input id="q" type="search" placeholder="名所名で絞り込み（例：下呂・松島）" autocomplete="off"></div>
  </div>
</header>

<main class="wrap" id="app">
  <p class="loading">読み込み中…</p>
</main>

<div class="bar">
  <div class="wrap">
    <p class="note" id="bar-note">切り替えたら「Issueで反映」を押すと、GitHubに整形済みで飛びます。送信するだけで自動反映されます。</p>
    <a class="btn" id="btn-issue" target="_blank" rel="noopener">Issueで反映（自動）</a>
    <button class="btn sec" id="btn-copy">内容をコピー</button>
    <a class="btn sec" id="btn-file" target="_blank" rel="noopener">ファイルを開く</a>
    <button class="btn ghost" id="btn-reset">変更を取消</button>
    <details class="raw">
      <summary>反映される内容（spot_overrides.json）を確認</summary>
      <textarea id="out" readonly></textarea>
    </details>
  </div>
</div>
<div class="toast" id="toast"></div>

<script>
(function () {
  "use strict";

  /* ====== 設定（リポジトリ情報）====== */
  var OWNER  = "shiyu-official";
  var REPO   = "shiyu-official.github.io";
  var BRANCH = "main";                       // 既定ブランチが master の場合はここを master に
  var FILE   = "data/spot_overrides.json";
  var LABEL  = "spot-override";

  /* ====== 状態 ====== */
  var cats = [];            // spot_visits.json の categories
  var autoState = {};       // id -> 自動判定(bool)
  var effState  = {};       // id -> 現在の実効(bool)  ※ユーザー操作対象
  var keep = { _note: "", _howto: "" };

  var $ = function (s, r) { return (r || document).querySelector(s); };
  var esc = function (s) { return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) {
    return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]; }); };

  function getJSON(p) { return fetch(p, { cache: "no-store" }).then(function (r) { if (!r.ok) throw 0; return r.json(); }); }

  Promise.all([
    getJSON("data/spot_visits.json"),
    getJSON("data/spot_overrides.json").catch(function () { return {}; })
  ]).then(function (res) {
    var d = res[0], ov = res[1] || {};
    cats = (d && d.categories) || [];
    if (!cats.length) throw new Error("no categories");
    if (typeof ov._note === "string") keep._note = ov._note;
    if (typeof ov._howto === "string") keep._howto = ov._howto;

    var off = {}, on = {};
    (ov.unvisited || []).forEach(function (id) { off[id] = true; });
    (ov.visited   || []).forEach(function (id) { on[id]  = true; });

    cats.forEach(function (c) {
      c.spots.forEach(function (s) {
        var auto = !!s.firstVisit;
        autoState[s.id] = auto;
        effState[s.id]  = off[s.id] ? false : (on[s.id] ? true : auto);
      });
    });
    render();
    update();
  }).catch(function () {
    $("#app").innerHTML = '<p class="error">データを読み込めませんでした。data/spot_visits.json を確認してください。</p>';
  });

  function render() {
    var html = cats.map(function (c) {
      var rows = c.spots.map(function (s) {
        return '' +
          '<div class="row" data-id="' + esc(s.id) + '" data-name="' + esc(s.name) + '">' +
            '<div class="row__body">' +
              '<span class="row__name">' + esc(s.name) + '</span>' +
              (s.pref ? '<span class="row__pref">' + esc(s.pref) + '</span>' : "") +
              '<span class="badge auto" data-badge>' + '</span>' +
            '</div>' +
            '<button class="toggle" type="button" aria-pressed="false" data-toggle="' + esc(s.id) + '"></button>' +
          '</div>';
      }).join("");
      return '' +
        '<section class="cat" data-cat>' +
          '<div class="cat__head">' +
            (c.iconImg ? '<img src="' + esc(c.iconImg) + '" alt="">' : "") +
            '<span class="cat__name">' + esc(c.name) + '</span>' +
            '<span class="cat__count" data-count></span>' +
          '</div>' + rows +
        '</section>';
    }).join("");
    $("#app").innerHTML = html;

    // トグル操作
    $("#app").addEventListener("click", function (ev) {
      var b = ev.target.closest("[data-toggle]");
      if (!b) return;
      var id = b.getAttribute("data-toggle");
      effState[id] = !effState[id];
      update();
    });
    // 検索フィルタ
    $("#q").addEventListener("input", function () {
      var q = this.value.trim().toLowerCase();
      Array.prototype.forEach.call(document.querySelectorAll(".row"), function (r) {
        var hit = !q || r.getAttribute("data-name").toLowerCase().indexOf(q) >= 0;
        r.classList.toggle("hidden", !hit);
      });
      Array.prototype.forEach.call(document.querySelectorAll("[data-cat]"), function (sec) {
        var any = sec.querySelector(".row:not(.hidden)");
        sec.classList.toggle("hidden", !any);
      });
    });
  }

  function computeOverride() {
    var unvisited = [], visited = [];
    cats.forEach(function (c) {
      c.spots.forEach(function (s) {
        var auto = autoState[s.id], eff = effState[s.id];
        if (auto && !eff) unvisited.push(s.id);
        if (!auto && eff) visited.push(s.id);
      });
    });
    return { unvisited: unvisited, visited: visited };
  }

  function fileJSON(ov) {
    // 書き込むファイル内容（_note/_howto を保持）
    var o = {};
    o._note  = keep._note  || "名所制覇の自動判定(proximity)を手動で補正するファイル。spot_visits.json を再生成しても上書きされません。";
    o._howto = keep._howto || "近くを通っただけ等で誤って訪問扱いになったスポットの id を unvisited に。逆に訪問済みへ強制したい id は visited に。id は data/spot_visits.json の spots[].id。";
    o.unvisited = ov.unvisited;
    o.visited   = ov.visited;
    return JSON.stringify(o, null, 2) + "\n";
  }

  function update() {
    var total = 0, visited = 0, changed = 0;
    cats.forEach(function (c) {
      var cv = 0;
      c.spots.forEach(function (s) {
        total++;
        if (effState[s.id]) { visited++; cv++; }
        if (effState[s.id] !== autoState[s.id]) changed++;
        // 行の見た目更新
        var row = document.querySelector('.row[data-id="' + cssq(s.id) + '"]');
        if (row) {
          var btn = row.querySelector("[data-toggle]");
          btn.setAttribute("aria-pressed", effState[s.id] ? "true" : "false");
          var badge = row.querySelector("[data-badge]");
          if (effState[s.id] !== autoState[s.id]) {
            badge.className = "badge manual"; badge.textContent = "手動";
            row.style.background = "#fff7f4";
          } else {
            badge.className = "badge auto"; badge.textContent = autoState[s.id] ? "自動" : "";
            row.style.background = "";
          }
        }
      });
      var cnt = c.spots.length;
      var cel = document.querySelectorAll("[data-count]")[cats.indexOf(c)];
      if (cel) { cel.textContent = cv + "/" + cnt; cel.classList.toggle("done", cv === cnt); }
    });

    var pct = total ? Math.round(visited / total * 100) : 0;
    $("#stat-count").textContent = visited;
    $("#stat-frac").textContent = "/ " + total + " 制覇（" + pct + "%）";
    $("#stat-chg").textContent = changed ? ("手動補正 " + changed + " 件") : "";

    var ov = computeOverride();
    var content = fileJSON(ov);
    $("#out").value = content;

    // Issue（整形済み）
    var title = "[spots] 名所制覇の手動補正";
    var body =
      "名所制覇の訪問判定を手動補正します（このIssueを送信すると自動反映されます）。\n\n" +
      "```json\n" + JSON.stringify(ov, null, 2) + "\n```\n";
    var issueURL = "https://github.com/" + OWNER + "/" + REPO + "/issues/new" +
      "?title=" + encodeURIComponent(title) +
      "&labels=" + encodeURIComponent(LABEL) +
      "&body="  + encodeURIComponent(body);
    $("#btn-issue").href = issueURL;

    // ファイル直接編集
    $("#btn-file").href = "https://github.com/" + OWNER + "/" + REPO + "/edit/" + BRANCH + "/" + FILE;
  }

  // querySelector 用の簡易エスケープ（id は英数と_のみ想定だが保険）
  function cssq(s) { return String(s).replace(/["\\\]]/g, "\\$&"); }

  $("#btn-copy").addEventListener("click", function () {
    var t = $("#out");
    var text = t.value;
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(text).then(function(){ toast("コピーしました"); },
        function(){ legacyCopy(t); });
    } else { legacyCopy(t); }
  });
  function legacyCopy(t){ t.focus(); t.select(); try { document.execCommand("copy"); toast("コピーしました"); } catch(e){ toast("コピーできませんでした"); } }

  $("#btn-reset").addEventListener("click", function () {
    cats.forEach(function (c) { c.spots.forEach(function (s) { effState[s.id] = autoState[s.id]; }); });
    update();
    toast("自動判定に戻しました");
  });

  var toTimer;
  function toast(msg) {
    var el = $("#toast"); el.textContent = msg; el.classList.add("show");
    clearTimeout(toTimer); toTimer = setTimeout(function () { el.classList.remove("show"); }, 1600);
  }
})();
</script>
</body>
</html>
