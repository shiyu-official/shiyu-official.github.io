<script>
/* data/blog.json から記事一覧を描画（記事があればカード、無ければ準備中表示） */
(function () {
  "use strict";
  var listEl = document.getElementById("blog-list");
  var emptyEl = document.getElementById("blog-empty");
  if (!listEl) return;

  function esc(s) {
    return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
    });
  }

  function card(p) {
    var thumb = p.thumb
      ? '<div class="card__thumb"><img src="' + esc(p.thumb) + '" alt="" loading="lazy"></div>'
      : '<div class="card__thumb"><img src="images/ogp.png" alt="" loading="lazy"></div>';
    var date = p.date ? '<p class="card__meta">' + esc(p.date.replace(/-/g, ".")) + "</p>" : "";
    var excerpt = p.excerpt ? '<p class="card__meta">' + esc(p.excerpt) + "</p>" : "";
    return '<a class="card" href="' + esc(p.url || "#") + '">' + thumb + date +
           '<p class="card__title">' + esc(p.title || "") + "</p>" + excerpt + "</a>";
  }

  if (typeof fetch === "undefined") return;
  fetch("data/blog.json", { cache: "no-store" })
    .then(function (r) { return r.json(); })
    .then(function (data) {
      var posts = (data && data.posts) ? data.posts : [];
      if (!posts.length) return;                 // 記事なし → 準備中表示のまま
      listEl.innerHTML = posts.map(card).join("");
      listEl.hidden = false;
      if (emptyEl) emptyEl.style.display = "none";
    })
    .catch(function () { /* 取得失敗時は準備中表示のまま */ });
})();
</script>
